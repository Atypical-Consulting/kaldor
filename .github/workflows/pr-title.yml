name: PR title

# PRs are squash-merged with the PR title as the commit subject, and release-please reads that subject
# to decide the version bump and the changelog entry. A title with no type would silently produce no
# release entry; this check makes it a red PR instead.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if ! echo "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit: use <type>[(scope)]: <subject>."
            exit 1
          fi
